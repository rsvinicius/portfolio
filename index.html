<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinicius Rodrigues Silva | Software Engineer</title>
    <meta name="description" content="Portfolio of Vinicius Rodrigues Silva, Software Engineer specializing in JVM architectures, distributed systems, and financial backends.">
    <meta name="author" content="Vinicius Rodrigues Silva">
    <meta name="theme-color" content="#0B0F19">
    <link rel="canonical" href="https://viniciussilva.dev/">

    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="Vinicius Rodrigues Silva | Software Engineer">
    <meta property="og:description" content="Software Engineer specializing in JVM architectures, distributed systems, and financial backends.">
    <meta property="og:image" content="https://viniciussilva.dev/assets/profile-photo.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://viniciussilva.dev/">

    <!-- Twitter Metadata -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Vinicius Rodrigues Silva | Software Engineer">
    <meta name="twitter:description" content="Software Engineer specializing in JVM architectures, distributed systems, and financial backends.">
    <meta name="twitter:image" content="https://viniciussilva.dev/assets/profile-photo.jpg">

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'surface-base': '#0B0F19',
                        'surface-base-light': '#F8FAFC',
                        'surface-card': '#111827',
                        'surface-card-light': '#FFFFFF',
                        'surface-card-subtle': '#1F2937',
                        'surface-card-subtle-light': '#F1F5F9',
                        'border-subtle': '#1F2937',
                        'border-subtle-light': '#E2E8F0',
                        'border-medium': '#374151',
                        'border-medium-light': '#CBD5E1',
                        'text-primary': '#F9FAFB',
                        'text-primary-light': '#0F172A',
                        'text-secondary': '#9CA3AF',
                        'text-secondary-light': '#475569',
                        'text-muted': '#6B7280',
                        'text-muted-light': '#64748B',
                        'accent-primary': '#3B82F6',
                        'accent-primary-hover': '#2563EB'
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'Fira Code', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- Beacon Pulse CSS & Critical Accessibility Styles -->
    <style>
        @keyframes beacon-pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }
        .beacon-dot {
            animation: beacon-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .beacon-dot {
                animation: none;
            }
        }
    </style>

    <!-- Theme initialization with try/catch to prevent FOUC (Dark mode default per DESIGN.md) -->
    <script>
        try {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0B0F19] text-[#0F172A] dark:text-[#F9FAFB] font-sans antialiased transition-colors duration-200 min-h-screen">
    <!-- Component containers -->
    <div id="header-container"></div>
    <div id="hero-container"></div>
    <div id="experience-container"></div>
    <div id="projects-container"></div>
    <div id="skills-container"></div>
    <div id="education-container"></div>
    <div id="contact-container"></div>
    <div id="footer-container"></div>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
